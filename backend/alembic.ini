# Alembic configuration.
# ---------------------------------------------------------------------------
# The database URL is deliberately ABSENT here. It is read from the app's own
# settings in alembic/env.py, so migrations always run against exactly the
# database the application uses. Duplicating the URL in this file is how the
# two drift apart and a migration gets applied to the wrong database.

[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped, ordered filenames - `git log` on the versions directory then
# reads chronologically instead of as a jumble of random hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
